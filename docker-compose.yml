# Full-stack deployment: Postgres + the .NET API + the built frontend behind nginx.
# For local development without Docker, see backend/README.md and backend/docker-compose.yml
# (Postgres only, run alongside `dotnet run` / `npm run dev` directly).
#
# Usage: copy .env.example to .env, fill it in (see comments there and backend/SECRETS.md),
# then `docker compose up -d --build`.
services:
  postgres:
    image: postgres:16
    container_name: yaraheem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: yaraheem_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ecommerce_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env - see backend/SECRETS.md}
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-admin@ecommerce.local}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-}
      Payments__WebhookSecret: ${PAYMENTS_WEBHOOK_SECRET:?Set PAYMENTS_WEBHOOK_SECRET in .env}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      DataProtection__KeyPath: /app/keys
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-}
      Email__SmtpUsername: ${EMAIL_SMTP_USERNAME:-}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD:-}
      Sms__Msg91ApiKey: ${SMS_MSG91_API_KEY:-}
      Sms__Msg91TemplateId: ${SMS_MSG91_TEMPLATE_ID:-}
      Sms__Msg91SenderId: ${SMS_MSG91_SENDER_ID:-}
      WhatsApp__TwilioAccountSid: ${WHATSAPP_TWILIO_ACCOUNT_SID:-}
      WhatsApp__TwilioAuthToken: ${WHATSAPP_TWILIO_AUTH_TOKEN:-}
      WhatsApp__TwilioFromNumber: ${WHATSAPP_TWILIO_FROM_NUMBER:-}
      Razorpay__KeyId: ${RAZORPAY_KEY_ID:-}
      Razorpay__KeySecret: ${RAZORPAY_KEY_SECRET:-}
      Razorpay__WebhookSecret: ${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - dataprotection_keys:/app/keys
      - api_logs:/app/logs
    expose:
      - "8080"

  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
        VITE_BASE_PATH: /
    container_name: yaraheem_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  postgres_data:
  dataprotection_keys:
  api_logs:
