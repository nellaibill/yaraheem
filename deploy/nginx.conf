# Used inside the "web" image (see ../Dockerfile). Serves the built SPA and reverse-proxies
# /api and /health to the "api" container so the browser sees everything as one origin — no
# CORS needed for normal traffic, and Cors:AllowedOrigins only matters for callers outside this
# proxy (a mobile app, a separately-hosted admin panel, etc.).
#
# This container itself only speaks plain HTTP on port 80. Put a TLS-terminating reverse proxy
# in front of it for a real deployment — see DEPLOYMENT.md.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    # Static assets: content-hashed filenames (Vite's default), so a long cache lifetime is safe.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — client-side routing (React Router) owns everything else.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
