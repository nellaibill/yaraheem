name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore Ecommerce.slnx

      - name: Build
        working-directory: backend
        run: dotnet build Ecommerce.slnx --no-restore

      - name: Test
        working-directory: backend
        run: dotnet test Ecommerce.slnx --no-build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (production)
        run: npm run build

      - name: Build (GitHub Pages demo mode)
        run: npm run build
        env:
          # A second build with the flag that gates the mock-backend code path (src/mocks) —
          # this is a genuinely different set of files being type-checked (the demo store must
          # satisfy the same DTOs as the real API client), and it has broken independently of
          # the plain production build more than once.
          VITE_DEMO_MODE: 'true'
